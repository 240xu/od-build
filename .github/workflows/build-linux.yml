name: Build OpenDesign Linux (headless + desktop)

# 产出两种 Linux 产物，同属一个 release：
#   od-headless-<ns>.tar.gz     纯 headless：daemon + web，无 Electron
#   Open.Design-<ns>.AppImage   桌面版（含 Electron）
#
# 触发：
#   - workflow_dispatch（手动，主用）
#   - schedule（每 6 小时兜底；GitHub 会在仓库 60 天无活动后静默禁用，
#     且高负载时段可能丢任务 —— 所以它不是主通路）
#   - repository_dispatch（由外部调度器投递，见 README「自动构建」一节）
#
# 注意：GitHub 的 webhook 是仓库作用域的，**不能跨仓库**把上游 release 事件
# 投到本仓库。所以「上游更新即自动构建」必须靠本机/外部定时器轮询后调用
# workflow_dispatch 或 dispatches API（已在 wuming 上用 systemd timer 落地）。

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游 ref（分支/tag/commit），留空=取最新 release tag"
        required: false
        default: ""
      namespace:
        description: "namespace（产物目录名 + launcher stamp）"
        required: false
        default: stable
      build_headless:
        description: "构建 headless"
        type: boolean
        required: false
        default: true
      build_desktop:
        description: "构建桌面版 AppImage"
        type: boolean
        required: false
        default: true
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [upstream-release]

concurrency:
  group: od-linux-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  UPSTREAM: nexu-io/open-design
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  CI: "true"

jobs:
  resolve:
    name: Resolve upstream
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      version: ${{ steps.pick.outputs.version }}
      should_build: ${{ steps.pick.outputs.should_build }}
      headless: ${{ steps.pick.outputs.headless }}
      desktop: ${{ steps.pick.outputs.desktop }}
      ns: ${{ steps.pick.outputs.ns }}
    steps:
      - name: Pick ref and decide
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.upstream_ref }}
          INPUT_NS: ${{ inputs.namespace }}
          INPUT_HEADLESS: ${{ inputs.build_headless }}
          INPUT_DESKTOP: ${{ inputs.build_desktop }}
          EVENT: ${{ github.event_name }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # ── 1. 定 ref ────────────────────────────────────────────────
          # gh api --jq 在 404 时会把错误 JSON 打到 **stdout**（实测 130 字节），
          # `|| echo ""` 救不了。必须显式判空 + 判非 JSON。
          ref="${INPUT_REF:-${PAYLOAD_TAG:-}}"
          if [ -z "$ref" ]; then
            cand=$(gh api "repos/$UPSTREAM/releases/latest" --jq '.tag_name' 2>/dev/null || true)
            case "$cand" in
              ""|*'{'*|*'}') cand="" ;;
            esac
            ref="${cand:-main}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

          # ── 2. 定 version ────────────────────────────────────────────
          # 上游 root package.json 的 version **不跟随 tag**（实测 v0.27.2 时
          # root 仍是 0.25.1）。只有 apps/packaged/package.json 与 tag 严格一致，
          # 所以优先从 tag 正则提取，取不到再读 packaged。
          ver=""
          if printf '%s' "$ref" | grep -qE '^open-design-v[0-9]+\.[0-9]+\.[0-9]+'; then
            ver=$(printf '%s' "$ref" | sed -E 's/^open-design-v//')
          fi
          if [ -z "$ver" ]; then
            ver=$(gh api "repos/$UPSTREAM/contents/apps/packaged/package.json?ref=$ref" \
                  -H "Accept: application/vnd.github.raw" 2>/dev/null \
                  | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])' 2>/dev/null || true)
            case "$ver" in ""|*'{'*) ver="" ;; esac
          fi
          if [ -z "$ver" ]; then
            echo "::error::cannot resolve upstream version (ref=$ref)"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

          ns="${INPUT_NS:-stable}"
          echo "ns=$ns" >> "$GITHUB_OUTPUT"

          # ── 3. 定目标 ────────────────────────────────────────────────
          headless="${INPUT_HEADLESS:-true}"
          desktop="${INPUT_DESKTOP:-true}"
          if [ "$EVENT" != "workflow_dispatch" ]; then headless=true; desktop=true; fi
          echo "headless=$headless" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"

          # ── 4. 定时触发时按精确 tag 判重 ─────────────────────────────
          # 先把列表落变量再 grep，避免 pipefail + SIGPIPE 把「有」误判成「无」。
          if [ "$EVENT" = "schedule" ]; then
            want="v${ver}"
            legacy="v${ver}-${ns}"
            tags=$(gh api "repos/$REPO/releases?per_page=100" --jq '.[].tag_name' 2>/dev/null || true)
            hit=0
            printf '%s\n' "$tags" | grep -Fxq "$want"   && hit=1
            printf '%s\n' "$tags" | grep -Fxq "$legacy" && hit=1
            if [ "$hit" = "1" ]; then
              echo "已有 release $want（或旧格式 $legacy），跳过"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "无 release $want，开始构建"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  headless:
    name: Build headless bundle
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true' && needs.resolve.outputs.headless == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: nexu-io/open-design
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 1

      - name: Checkout build harness
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: .ci
          fetch-depth: 1

      - name: Setup pnpm 10.33.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web static export
        run: pnpm --filter @open-design/web build

      - name: Patch web next.config (CMS fingerprint, PR #8538)
        run: python3 .ci/scripts/patch-cms-fingerprint.py

      - name: Assemble payload (target=dir)
        env:
          NS: ${{ needs.resolve.outputs.ns }}
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/od-out"
          rm -rf "$out_dir"; mkdir -p "$out_dir"
          pnpm exec tools-pack linux build \
            --dir "$out_dir" \
            --namespace "$NS" \
            --portable \
            --to dir \
            --json | tee "$RUNNER_TEMP/build.json"

      - name: Patch web/out into assembled
        env:
          NS: ${{ needs.resolve.outputs.ns }}
        run: |
          set -euo pipefail
          web="$RUNNER_TEMP/od-out/out/linux/namespaces/$NS/assembled/app/node_modules/@open-design/web"
          [ -d "$web" ] || { echo "web package not found: $web"; exit 1; }
          [ -d "$web/out" ] || cp -a apps/web/out "$web/out"
          test -d "$web/out"

      - name: Verify headless prerequisites
        env:
          NS: ${{ needs.resolve.outputs.ns }}
        run: |
          set -euo pipefail
          nsdir="$RUNNER_TEMP/od-out/out/linux/namespaces/$NS"
          fail=0
          chk() { if [ -e "$1" ]; then echo "OK   $1"; else echo "MISS $1"; fail=1; fi; }
          chk "$nsdir/assembled/app/node_modules/@open-design/packaged/dist/headless.mjs"
          chk "$nsdir/assembled/app/node_modules/@open-design/daemon/dist/sidecar/index.js"
          chk "$nsdir/assembled/app/node_modules/@open-design/web/out/index.html"
          chk "$nsdir/resources/open-design/bin/node"
          if [ -d "$nsdir/assembled/app/node_modules/electron" ]; then
            echo "UNEXPECTED electron in headless payload"; fail=1
          else
            echo "OK   no electron"
          fi
          if grep -q hasCmsHostReleaseInputs \
               "$nsdir/assembled/app/node_modules/@open-design/web/next.config.ts"; then
            echo "OK   next.config patched"
          else
            echo "FAIL next.config missing CMS patch"; fail=1
          fi
          [ "$fail" = "0" ] || exit 1

      - name: Generate launcher
        env:
          NS: ${{ needs.resolve.outputs.ns }}
        run: python3 .ci/scripts/make-launcher.py "$NS" dist/launcher

      - name: Package headless bundle
        env:
          NS: ${{ needs.resolve.outputs.ns }}
        run: |
          set -euo pipefail
          nsdir="$RUNNER_TEMP/od-out/out/linux/namespaces/$NS"
          stage="$RUNNER_TEMP/stage"
          rm -rf "$stage"
          mkdir -p "$stage/out/linux/namespaces/$NS" "$stage/launcher" "$stage/runtime/linux"
          cp -a "$nsdir/assembled" "$stage/out/linux/namespaces/$NS/"
          cp -a "$nsdir/resources" "$stage/out/linux/namespaces/$NS/"
          cp -a "dist/launcher/open-design-headless-$NS" "$stage/launcher/"
          python3 .ci/scripts/make-readme.py "$NS" "$stage/README.md"
          tar -C "$stage" -czf "dist/od-headless-$NS.tar.gz" .
          ls -lh dist/

      - name: Smoke-run launcher
        env:
          NS: ${{ needs.resolve.outputs.ns }}
        run: python3 .ci/scripts/smoke-headless.py "dist/od-headless-$NS.tar.gz" "$NS"

      - uses: actions/upload-artifact@v4
        with:
          name: headless-${{ needs.resolve.outputs.ns }}
          path: dist/od-headless-${{ needs.resolve.outputs.ns }}.tar.gz
          retention-days: 7
          if-no-files-found: error

  desktop:
    name: Build desktop AppImage
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true' && needs.resolve.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: nexu-io/open-design
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 1

      - name: Checkout build harness
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: .ci
          fetch-depth: 1

      - name: Setup pnpm 10.33.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web static export
        run: pnpm --filter @open-design/web build

      # 桌面版同样需要这个补丁，否则首次启动就崩在 next.config
      - name: Patch web next.config (CMS fingerprint, PR #8538)
        run: python3 .ci/scripts/patch-cms-fingerprint.py

      - name: Build AppImage (native, not containerized)
        env:
          NS: ${{ needs.resolve.outputs.ns }}
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/od-out"
          rm -rf "$out_dir"; mkdir -p "$out_dir"
          pnpm exec tools-pack linux build \
            --dir "$out_dir" \
            --namespace "$NS" \
            --portable \
            --to appimage \
            --json | tee "$RUNNER_TEMP/build.json"
          node -e 'const fs=require("fs");JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log("build.json OK")' "$RUNNER_TEMP/build.json"

      - name: Collect AppImage
        run: |
          set -euo pipefail
          mkdir -p dist
          find "$RUNNER_TEMP/od-out" -name '*.AppImage' -exec cp -v {} dist/ \;
          ls -lh dist/
          test -n "$(ls -A dist)" || { echo "no AppImage produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ needs.resolve.outputs.ns }}
          path: dist/*.AppImage
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish release
    needs: [resolve, headless, desktop]
    # 只有两个目标**都**成功才发布 —— 否则 release 会缺件，违背「两种产物」的承诺。
    if: |
      !cancelled() &&
      needs.resolve.outputs.should_build == 'true' &&
      needs.headless.result == 'success' &&
      needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List
        run: ls -lh dist/

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.resolve.outputs.version }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REF: ${{ needs.resolve.outputs.ref }}
          NS: ${{ needs.resolve.outputs.ns }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes=$(cat <<MD
          OpenDesign Linux build for upstream \`$REF\` (version $VERSION).

          | asset | contents |
          |---|---|
          | \`od-headless-$NS.tar.gz\` | headless runtime — daemon + web, **no Electron** |
          | \`*.AppImage\` | desktop build, includes Electron |

          Built with pnpm 10.33.2 / Node 24 on ubuntu-latest, with
          \`ONNXRUNTIME_NODE_INSTALL_CUDA=skip\` and the upstream PR #8538
          CMS-fingerprint patch applied (see repo README).

          > Asset names are sanitized by GitHub: spaces become dots, so the
          > desktop file appears as \`Open.Design-$NS.AppImage\`.
          MD
          )
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            echo "updated existing release $TAG"
          else
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "OpenDesign Linux $VERSION" --notes "$notes"
            echo "created release $TAG"
          fi
