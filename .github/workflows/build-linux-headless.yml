name: Build OpenDesign headless (Linux, no Electron)

# 产出可直接部署的 headless 运行集：assembled app + bundled node/vela + launcher。
# 运行时不需要 Electron，也不需要源码树。
#
# 目录契约（与官方 tools-pack linux install --headless 生成的 launcher 一致）：
#   <root>/out/linux/namespaces/<ns>/assembled/          应用主体
#   <root>/out/linux/namespaces/<ns>/resources/          bundled node + vela
#   <root>/runtime/linux/                                运行期数据/状态
#
# 用法：Actions → Build OpenDesign headless → Run workflow

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游 ref（分支/tag/commit）"
        required: false
        default: main
      namespace:
        description: "namespace（产物目录名 + launcher stamp）"
        required: false
        default: stable

concurrency:
  group: od-headless-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM: nexu-io/open-design
  # onnxruntime 的 install 钩子要下 CUDA EP 二进制，受限网络下 404 → 构建失败
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  CI: "true"

jobs:
  build:
    name: Build headless bundle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ inputs.upstream_ref }}
          fetch-depth: 1

      - name: Show upstream version
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json");console.log("version:",p.version,"| engines:",JSON.stringify(p.engines))'
          git log -1 --format='commit %h  %ci  %s'

      - name: Setup pnpm 10.33.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # web 静态导出：headless 的 web sidecar 走 Next 静态导出，
      # 但 apps/web/package.json 的 files 不含 out → pnpm pack 不带上
      - name: Build web static export
        run: pnpm --filter @open-design/web build

      - name: Verify web export
        run: |
          set -euo pipefail
          test -d apps/web/out || { echo "apps/web/out missing"; exit 1; }
          du -sh apps/web/out

      # 用 dir 目标组装 payload —— 不产出 AppImage，因此不引入 Electron 打包
      - name: Assemble payload (target=dir)
        env:
          NS: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/od-out"
          rm -rf "$out_dir"; mkdir -p "$out_dir"
          pnpm exec tools-pack linux build \
            --dir "$out_dir" \
            --namespace "$NS" \
            --portable \
            --to dir \
            --json | tee "$RUNNER_TEMP/build.json"
          node -e 'const fs=require("fs");JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log("build.json OK")' "$RUNNER_TEMP/build.json"

      - name: Patch web/out into assembled
        env:
          NS: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          # 先把结构打出来，避免下次失败又要猜路径
          echo '--- namespace dir tree (depth 3) ---'
          find "$RUNNER_TEMP/od-out/out/linux/namespaces/$NS" -maxdepth 3 -type d | sort | head -40
          web="$RUNNER_TEMP/od-out/out/linux/namespaces/$NS/assembled/app/node_modules/@open-design/web"
          [ -d "$web" ] || { echo "web package not found: $web"; exit 1; }
          if [ ! -d "$web/out" ]; then
            cp -a apps/web/out "$web/out"
            echo "patched web/out"
          fi
          test -d "$web/out" || { echo "web/out still missing"; exit 1; }
          du -sh "$web/out"

      # 硬校验：headless 运行所需文件必须存在；且不得含 Electron
      - name: Verify headless prerequisites
        env:
          NS: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          nsdir="$RUNNER_TEMP/od-out/out/linux/namespaces/$NS"
          fail=0
          chk() { if [ -e "$1" ]; then echo "OK   $1"; else echo "MISS $1"; fail=1; fi; }
          chk "$nsdir/assembled/app/node_modules/@open-design/packaged/dist/headless.mjs"
          chk "$nsdir/assembled/app/node_modules/@open-design/daemon/dist/sidecar/index.js"
          chk "$nsdir/assembled/app/node_modules/@open-design/web/dist/sidecar/index.js"
          chk "$nsdir/assembled/app/node_modules/@open-design/web/out/index.html"
          chk "$nsdir/resources/open-design/bin/node"
          if [ -d "$nsdir/assembled/app/node_modules/electron" ]; then
            echo "UNEXPECTED electron in payload"; fail=1
          else
            echo "OK   no electron (pure headless)"
          fi
          "$nsdir/resources/open-design/bin/node" -v
          [ "$fail" = "0" ] || exit 1

      # 生成 launcher：heredoc 内容统一缩进后 sed 去除，保持脚本首行为 shebang
      - name: Generate launcher
        env:
          NS: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          mkdir -p dist/launcher
          cat > "$RUNNER_TEMP/launcher.tmpl" <<'SH'
          #!/bin/sh
          # Open Design headless launcher — namespace: NSNAME
          # 由 od-build CI 依官方模板生成。ROOT 为本 bundle 解压目录，
          # 可用 OD_ROOT 覆盖。
          ROOT="${OD_ROOT:-$(cd "$(dirname "$0")/../.." && pwd)}"
          RES="$ROOT/out/linux/namespaces/NSNAME/resources/open-design"
          ENTRY="$ROOT/out/linux/namespaces/NSNAME/assembled/app/node_modules/@open-design/packaged/dist/headless.mjs"
          OPEN_DESIGN_AMR_ENDPOINT_BINDING='' \
          OD_PACKAGED_NAMESPACE="NSNAME" \
          OD_DATA_DIR="$ROOT/runtime/linux" \
          OD_RESOURCE_ROOT="$RES" \
            exec "$RES/bin/node" "$ENTRY" "$@"
          SH
          sed -e 's/^          //' -e "s/NSNAME/$NS/g" "$RUNNER_TEMP/launcher.tmpl" \
            > "dist/launcher/open-design-headless-$NS"
          chmod +x "dist/launcher/open-design-headless-$NS"
          echo '--- generated launcher ---'
          cat "dist/launcher/open-design-headless-$NS"

      - name: Package bundle
        env:
          NS: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          nsdir="$RUNNER_TEMP/od-out/out/linux/namespaces/$NS"
          stage="$RUNNER_TEMP/stage"
          rm -rf "$stage"
          mkdir -p "$stage/out/linux/namespaces/$NS" "$stage/launcher" "$stage/runtime/linux"
          cp -a "$nsdir/assembled" "$stage/out/linux/namespaces/$NS/"
          cp -a "$nsdir/resources" "$stage/out/linux/namespaces/$NS/"
          cp -a "dist/launcher/open-design-headless-$NS" "$stage/launcher/"
          cat > "$RUNNER_TEMP/readme.tmpl" <<'MD'
          # OpenDesign headless bundle (NSNAME)

          纯 headless 运行集：daemon + web，**无 Electron**。

          ## 部署

              tar -xzf od-headless-NSNAME.tar.gz -C ~/od-headless
              ~/od-headless/launcher/open-design-headless-NSNAME

          启动后 daemon/web 监听 127.0.0.1 动态端口；用官方 status IPC 查实际 URL。
          数据落在 `runtime/linux`。

          **保活注意**：官方 headless 主进程打印 URL 后会主动 return（supervisor 被
          reparent 到 init），因此 systemd 直接用 `Type=simple` 跑 launcher 会看到
          「主进程正常退出」并连带 SIGKILL 整棵 cgroup。需要包装脚本盯住 sidecar
          状态 IPC 维持存活。

          ## 结构

              out/linux/namespaces/NSNAME/assembled/   应用主体（含 web/out 静态导出）
              out/linux/namespaces/NSNAME/resources/   bundled node + vela
              runtime/linux/                           运行期数据/状态
              launcher/open-design-headless-NSNAME     启动脚本
          MD
          sed "s/NSNAME/$NS/g" "$RUNNER_TEMP/readme.tmpl" > "$stage/README.md"
          tar -C "$stage" -czf "dist/od-headless-$NS.tar.gz" .
          ls -lh dist/
          du -sh "$stage"

      # 解包后直接起 launcher：只要不在模块加载阶段崩溃即视为通过
      - name: Smoke-run launcher
        env:
          NS: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/smoke"
          rm -rf "$D"; mkdir -p "$D"
          tar -xzf "dist/od-headless-$NS.tar.gz" -C "$D"
          chmod +x "$D/launcher/open-design-headless-$NS"
          set +e
          timeout 90 "$D/launcher/open-design-headless-$NS" >"$D/run.log" 2>&1
          code=$?
          set -e
          echo "launcher exit=$code (124 = timeout, 预期：headless 主进程自行 return)"
          tail -40 "$D/run.log" || true
          if grep -qE "Cannot find module|ERR_MODULE_NOT_FOUND|failed to resolve" "$D/run.log"; then
            echo "FAIL: launcher cannot load modules"; exit 1
          fi
          echo "SMOKE PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: od-headless-${{ inputs.namespace }}
          path: dist/od-headless-${{ inputs.namespace }}.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "### Headless bundle"
            echo ""
            echo "- upstream: \`${{ inputs.upstream_ref }}\`"
            echo "- namespace: \`${{ inputs.namespace }}\`"
            echo ""
            echo '```'
            ls -lh dist 2>/dev/null || echo "(no dist)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
