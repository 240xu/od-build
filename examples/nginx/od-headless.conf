# ─────────────────────────────────────────────────────────────────────────────
# OpenDesign headless — nginx reverse-proxy snippet
#
# Copy this file into your nginx config and include it from the `location /`
# block that fronts the OpenDesign web sidecar.
#
#   location / {
#       include /etc/nginx/snippets/od-headless.conf;
#       proxy_pass http://127.0.0.1:7457;   # ← your socat/portal listen address
#       proxy_request_buffering off;
#       proxy_buffering off;
#       proxy_read_timeout 3600s;
#       proxy_send_timeout 3600s;
#   }
#
# Both fixes below are WORKAROUNDS for upstream limitations. They are not
# feature changes and they do not touch the OpenDesign source tree. See
# docs/UPSTREAM-LIMITATIONS.md for the full analysis.
# ─────────────────────────────────────────────────────────────────────────────

# ── Fix 1: blank the Origin header ───────────────────────────────────────────
#
# WHY
#   The packaged runtime filters the environment it hands to its child
#   processes through PACKAGED_CHILD_ENV_ALLOWLIST
#   (apps/packaged/dist/headless.mjs). That list has 20 entries and does NOT
#   include OD_ALLOWED_ORIGINS — even though the daemon reads it.
#
#   Consequence: the daemon rejects every cross-origin write request. A
#   browser POST from the same origin is still treated as cross-origin, so
#   creating a project or sending a message fails with 403.
#
# WHAT THIS DOES
#   Strips Origin before the request reaches the daemon, so the daemon takes
#   its "non-browser client" path. All authentication and origin policy then
#   lives in nginx — make sure your nginx layer actually does authenticate.
#
# TRADE-OFF
#   The daemon's own origin check is effectively disabled. Only do this behind
#   an authenticating proxy. This is what the reference deployment does:
#   a token gate (`?token=…` or a cookie) checked in nginx before the proxy.
#
# Permanent alternative: patch PACKAGED_CHILD_ENV_ALLOWLIST to add
#   "OD_ALLOWED_ORIGINS", rebuild the bundle, and keep it patched on upgrade.
proxy_set_header Origin "";

# ── Fix 2: narrow-window sidebar (≤1080px) ───────────────────────────────────
#
# WHY
#   Upstream `entry-layout.css` zeroes the docked rail below 1080px and marks
#   it `pointer-events: none; overflow: hidden`:
#
#     @media (max-width:1080px){
#       .entry-shell--no-header .entry.entry--rail-open{
#         grid-template-columns: 0 minmax(0,1fr)
#       }
#       .entry--rail-open .entry-nav-rail{
#         pointer-events: none; overflow: hidden
#       }
#     }
#
#   The rail toggle keeps flipping the persisted state, but nothing can be
#   shown at that width, so the button reads as dead. Upstream tracks the real
#   fix in PR #9306 (overlay drawer), still unmerged.
#
# WHAT THIS DOES
#   Restores the rail track and re-enables pointer events below 1080px.
#
# REQUIRES NO-COMPRESSION
#   nginx `sub_filter` only rewrites plain text. Next.js serves gzipped HTML
#   to browsers, so the filter silently misses unless you disable compression
#   for this response. Both directives below are mandatory.
proxy_set_header Accept-Encoding "";
gzip off;

sub_filter_once on;
sub_filter_types text/html;
sub_filter '</head>' '<style id="od-rail-fix">@media (max-width:1080px){.entry-shell--no-header .entry.entry--rail-open{grid-template-columns:var(--entry-rail-width,236px) minmax(0,1fr)!important}.entry--rail-open .entry-nav-rail{pointer-events:auto!important;overflow:visible!important}}</style></head>';
